- name: Run the equivalent of apt-get update.
  ansible.builtin.apt:
    update_cache: yes

- name: Download java packages from https://jdk.java.net/archive/.
  ansible.builtin.get_url:
    url: "https://download.java.net/java/GA/jdk17.0.2/dfd4a8d0985749f896bed50d7138ee7f/8/GPL/openjdk-17.0.2_linux-x64_bin.tar.gz"
    dest: "/tmp/openjdk-17.0.2_linux-x64_bin.tar.gz"
    mode: "0644"

- name: Create java dir.
  ansible.builtin.file:
    path: /opt/java
    state: directory
    mode: '0755'

- name: Extract JDK.
  ansible.builtin.unarchive:
    src: "/tmp/openjdk-17.0.2_linux-x64_bin.tar.gz"
    dest: "/opt/java/"
    remote_src: yes
    creates: "/opt/java/jdk-17.0.2"

- name: Remove tmp JDK package.
  ansible.builtin.file:
    path: "/tmp/openjdk-17.0.2_linux-x64_bin.tar.gz"
    state: absent

- name: Set JAVA_HOME environment variable.
  ansible.builtin.lineinfile:
    path: /etc/profile.d/java.sh
    line: "export JAVA_HOME=/opt/java/jdk-17.0.2"
    create: yes

- name: Add JDK to PATH.
  ansible.builtin.lineinfile:
    path: /etc/profile.d/java.sh
    line: "export PATH=$JAVA_HOME/bin:$PATH"
    create: yes

- name: Added alternatives for Java
  alternatives:
    name: java
    link: /usr/bin/java
    path: /opt/java/jdk-17.0.2/bin/java
    priority: 1

